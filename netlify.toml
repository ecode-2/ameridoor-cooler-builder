# Netlify configuration for frontend deployment
[build]
  # Repo root - overrides a stale "base" directory set in the Netlify UI
  base = "."
  # No build step needed - static files
  publish = "frontend"

[build.environment]
  # Set to production
  NODE_ENV = "production"

[functions]
  # Overrides a stale Functions directory setting from the Netlify UI
  # that was mistakenly pointing at the netlify.toml file itself
  directory = "netlify/functions"

# Redirect all requests to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
